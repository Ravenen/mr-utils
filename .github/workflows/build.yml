name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build and zip
        id: package
        run: |
          pnpm zip
          pnpm zip:firefox
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Chromium for the e2e tests
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (Playwright, built Chrome extension on mock GitLab pages)
        run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Lint for Firefox (web-ext)
        run: pnpm exec web-ext lint --source-dir .output/firefox-mv3

      - name: Check that the AMO sources zip rebuilds the Firefox build
        run: ./scripts/verify-sources.sh

      - uses: actions/upload-artifact@v7
        id: upload-chrome
        with:
          name: mrflow-${{ steps.package.outputs.version }}-${{ steps.package.outputs.sha }}-chrome
          path: .output/chrome-mv3/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        id: upload-firefox
        with:
          name: mrflow-${{ steps.package.outputs.version }}-${{ steps.package.outputs.sha }}-firefox
          path: .output/firefox-mv3/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        id: upload-sources
        with:
          name: mrflow-${{ steps.package.outputs.version }}-${{ steps.package.outputs.sha }}-amo-sources
          path: .output/mrflow-${{ steps.package.outputs.version }}-sources.zip
          if-no-files-found: error

      - name: Install instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ### MRFlow ${{ steps.package.outputs.version }} (${{ steps.package.outputs.sha }})

          Download the build for your browser and unzip it.

          - **Chrome** ([download](${{ steps.upload-chrome.outputs.artifact-url }})): open \`chrome://extensions\`, turn on *Developer mode*, click *Load unpacked* and pick the unzipped folder.
          - **Firefox** ([download](${{ steps.upload-firefox.outputs.artifact-url }})): open \`about:debugging#/runtime/this-firefox\`, click *Load Temporary Add-on…* and pick \`manifest.json\` in the unzipped folder.

          Disable the store version of MRFlow while testing, otherwise both run on the page.

          [AMO sources zip](${{ steps.upload-sources.outputs.artifact-url }}): what to upload to addons.mozilla.org next to the Firefox build (already checked to rebuild it byte for byte).
          SUMMARY
