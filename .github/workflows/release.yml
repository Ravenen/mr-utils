name: Release

# Every push to main updates the release PR (branch release/next, scripts/release-pr.sh): the next
# version from the Conventional Commits since the last tag (git-cliff, cliff.toml) in package.json and
# its section on top of CHANGELOG.md. Merging that PR leaves main with a version that has no tag yet:
# the release job then tags vX.Y.Z, creates the GitHub release from its CHANGELOG section, and the
# publish job below builds it and submits it to the Chrome Web Store and AMO.
# The publish job runs in this workflow because a tag pushed with GITHUB_TOKEN starts no workflows.
# Store credentials: see docs/releasing.md. Without them the stores are skipped with a warning.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and submit again (e.g. v2.0.0), or main to check the store credentials before the first release
        required: true
      dry_run:
        description: Only check the store credentials, upload nothing
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

# One run at a time, so the release PR and the tags follow the pushes in order
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # All history and tags: the changelog is everything since the last tag
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Tag the version of a merged release PR
        id: tag
        run: |
          version=$(node -p "require('./package.json').version")
          if git rev-parse --quiet --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"
            exit 0
          fi
          # Its CHANGELOG section, without the heading, is the text of the GitHub release
          awk -v heading="## [$version]" 'index($0, "## [") == 1 { if (found) exit; found = index($0, heading) == 1; next } found' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file "$RUNNER_TEMP/notes.md"
          echo "tag_name=v$version" >> "$GITHUB_OUTPUT"

      - name: Open or update the release PR
        if: steps.tag.outputs.tag_name == ''
        run: scripts/release-pr.sh

  publish:
    needs: release
    if: always() && (needs.release.outputs.tag_name != '' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag_name || inputs.tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint && pnpm typecheck && pnpm test

      - name: Build and zip
        id: package
        run: |
          pnpm zip
          pnpm zip:firefox
          version=$(node -p "require('./package.json').version")
          echo "chrome=.output/mrflow-${version}-chrome.zip" >> "$GITHUB_OUTPUT"
          echo "firefox=.output/mrflow-${version}-firefox.zip" >> "$GITHUB_OUTPUT"
          echo "sources=.output/mrflow-${version}-sources.zip" >> "$GITHUB_OUTPUT"

      - name: Check that the AMO sources zip rebuilds the Firefox build
        run: ./scripts/verify-sources.sh

      - name: Attach the zips to the GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber \
              ${{ steps.package.outputs.chrome }} ${{ steps.package.outputs.firefox }} ${{ steps.package.outputs.sources }}
          else
            echo "::warning::No GitHub release named $TAG: zips not attached"
          fi

      - name: Submit to the Chrome Web Store and AMO
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          # The add-on's AMO slug or numeric ID, not its {uuid} GUID: publish-browser-extension strips the
          # braces, and AMO then looks the rest up as a slug and answers 404
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          # The key may be pasted as the JSON value, with literal \n: make them real line breaks
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY="$(printf '%b' "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY")"
          export CHROME_SERVICE_ACCOUNT_PRIVATE_KEY
          args=()
          if [ -n "$CHROME_EXTENSION_ID" ] && [ -n "$CHROME_PUBLISHER_ID" ] && [ -n "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" ]; then
            args+=(--chrome-zip "${{ steps.package.outputs.chrome }}")
          else
            echo "::warning::Chrome Web Store credentials are not set (docs/releasing.md): not submitted"
          fi
          if [ -n "$FIREFOX_EXTENSION_ID" ] && [ -n "$FIREFOX_JWT_ISSUER" ] && [ -n "$FIREFOX_JWT_SECRET" ]; then
            # The code is bundled, so AMO gets the sources zip its reviewers rebuild from
            args+=(--firefox-zip "${{ steps.package.outputs.firefox }}" --firefox-sources-zip "${{ steps.package.outputs.sources }}")
          else
            echo "::warning::AMO credentials are not set (docs/releasing.md): not submitted"
          fi
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          if [ ${#args[@]} -gt 0 ] && [ "${args[*]}" != "--dry-run" ]; then
            pnpm wxt submit "${args[@]}"
          fi
