name: Bug report
description: Something does not work or looks broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw. Screenshots help.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page
      description: Kind of page, e.g. project MR list, dashboard MR list, MR overview, MR changes
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MRFlow version
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: DevTools console output mentioning MRFlow, if any
      render: text
